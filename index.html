<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kazoku HomeCare - Beranda</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="hamburger-menu" id="hamburgerMenu">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>

            <nav class="popup-nav" id="popupNav">
                <ul>
                    <li><a href="#" id="artikelKesehatanLink">ARTIKEL KESEHATAN</a></li>
                    <li><a href="#" id="perawatLink">PERAWAT</a></li>
                    <li><a href="#" id="berandaLink">BERANDA</a></li>
                </ul>
            </nav>

        </header>

        <main class="hero-section" id="heroSection">
            <div class="hero-content-left">
                <p class="welcome-text">WELCOME IN</p>
                <h1 class="brand-name">
                    <img src="img/logo.png" alt="Kazoku Homecare Logo" class="brand-logo">
                    Kazoku HC
                </h1>
                <a href="https://forms.gle/E7LgXA2RArhWe22E6" target="_blank" class="daftar-button">Daftar</a>
            </div>

            <div class="hero-content-right">
                <div class="image-stack">
                    <img src="img/img1.jpg" alt="Medical Checkup" class="stacked-image img-1">
                    <img src="img/img2.jpg" alt="Happy Patient" class="stacked-image img-2">
                    <img src="img/img3.jpg" alt="Home Care" class="stacked-image img-3">
                </div>
            </div>
        </main>

        <section class="articles-section" id="articlesSection">
            <h2>ARTIKEL KESEHATAN</h2>
            <div class="poster-grid">
                <div class="poster-item">
                    <img src="img/poster1.jpg" alt="Poster Tetap Bahagia Tetap Sehat">
                </div>
                <div class="poster-item">
                    <img src="img/poster2.jpg" alt="Poster Maag Asam Lambung GERD">
                </div>
                <div class="poster-item">
                    <img src="img/poster3.jpg" alt="Poster Dampak Polusi">
                </div>
            </div>
        </section>

        <section class="nurses-section" id="nursesSection">
            <h2>NAMA-NAMA PERAWAT</h2>
            <div class="nurses-grid">
                <div class="nurse-card">
                    <img src="img/poto1.jpg" alt="Ilustrasi Perawat 1">
                    <p class="nurse-name">(Erina Suryana,S.Kep.)</p>
                </div>
                <div class="nurse-card">
                    <img src="img/poto2.jpg" alt="Ilustrasi Perawat 2">
                    <p class="nurse-name">(Fitriyani Amirah,S.Kep.)</p>
                </div>
                <div class="nurse-card">
                    <img src="img/poto3.jpg" alt="Ilustrasi Perawat 3">
                    <p class="nurse-name">(Ghina Sausani,S.Kep.)</p>
                </div>
                <div class="nurse-card">
                    <img src="img/poto4.jpg" alt="Ilustrasi Perawat 4">
                    <p class="nurse-name">(Lisda Septriani,S.Kep.)</p>
                </div>
                <div class="nurse-card">
                    <img src="img/poto5.jpg" alt="Ilustrasi Perawat 5">
                    <p class="nurse-name">(Siti Nurfadila,S.Kep.)</p>
                </div>
                <div class="nurse-card">
                    <img src="img/poto6.jpg" alt="Ilustrasi Perawat 6">
                    <p class="nurse-name">(Yayu Rismaya,S.Kep.)</p>
                </div>
            </div>
        </section>

        <div class="doodle doodle-1"></div>
        <div class="doodle doodle-2"></div>
        <div class="doodle doodle-3"></div>
        <div class="doodle doodle-4"></div>
        <div class="doodle doodle-5"></div>
        <div class="doodle doodle-6"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
